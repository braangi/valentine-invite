<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>💌 Valentine Invite</title>
  <style>
    :root{
      --bg:#ffe6ec;
      --card:#ffffff;
      --text:#1f1f1f;
      --pink:#ff4d7d;
      --pink2:#ff7aa2;
      --shadow: 0 18px 50px rgba(0,0,0,.12);
      --radius: 22px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      height:100vh;
      display:grid;
      place-items:center;
      background: radial-gradient(circle at 20% 10%, #fff 0 120px, transparent 130px),
                  radial-gradient(circle at 80% 20%, #fff 0 110px, transparent 120px),
                  var(--bg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--text);
      overflow:hidden;
    }
    .card{
      width:min(520px, 92vw);
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:28px 22px;
      text-align:center;
      position:relative;
    }
    h1{
      margin:0 0 10px;
      font-size: clamp(26px, 4vw, 34px);
      letter-spacing:-.02em;
    }
    p{
      margin:0 0 18px;
      font-size: 16px;
      line-height:1.4;
      opacity:.9;
    }
    .btnrow{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      justify-content:center;
      margin-top: 14px;
    }
    button{
      border:0;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 16px;
      cursor:pointer;
      transition: transform .08s ease, filter .12s ease;
      user-select:none;
      touch-action: manipulation;
    }
    button:active{ transform: translateY(1px) scale(.99); }
    .primary{
      background: linear-gradient(135deg, var(--pink), var(--pink2));
      color:white;
      font-weight:650;
    }
    .ghost{
      background:#f2f2f2;
      color:#222;
    }
    .tiny{
      margin-top:14px;
      font-size: 12px;
      opacity:.65;
    }

    /* “Runaway” button positioning layer */
    #runaway{
      position: relative;
    }

    /* confetti canvas */
    canvas{
      position:fixed;
      inset:0;
      pointer-events:none;
    }
  </style>
</head>

<body>
  <canvas id="confetti"></canvas>

  <div class="card" id="card">
    <h1>Will you be my Valentine? 💌</h1>
    <p>No pressure—just a quick question with a fun interface 😅</p>

    <div class="btnrow">
      <button class="primary" id="yes1">Yes 😊</button>
      <button class="primary" id="yes2">Yes but dramatic 💃</button>
      <button class="ghost" id="runaway">Let me think… 🤔</button>
    </div>

    <div class="tiny">Tip: this page works best on your phone 🙂</div>
  </div>

  <script>
    // --- Settings you can customize ---
    const datePlanText = "Dinner this Friday at 7? ❤️"; // change to your plan
    const signature = "— Derik"; // optional

    // --- Accept flow ---
    const card = document.getElementById("card");
    document.getElementById("yes1").addEventListener("click", accept);
    document.getElementById("yes2").addEventListener("click", accept);

    function accept(){
      card.innerHTML = `
        <h1>Nice. You’re officially my Valentine ❤️</h1>
        <p>${datePlanText}</p>
        <p style="margin-top:10px;opacity:.85">${signature}</p>
      `;
      popConfetti(160);
    }

    // --- Runaway button ---
    const runaway = document.getElementById("runaway");
    runaway.addEventListener("mouseenter", moveRunaway);
    runaway.addEventListener("touchstart", (e) => { e.preventDefault(); moveRunaway(); }, {passive:false});

    function moveRunaway(){
      runaway.style.position = "fixed";
      // Keep it within the viewport (avoid edges)
      const pad = 20;
      const x = pad + Math.random() * (window.innerWidth - pad*2);
      const y = pad + Math.random() * (window.innerHeight - pad*2);
      runaway.style.left = x + "px";
      runaway.style.top = y + "px";
    }

    // --- Lightweight confetti ---
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");
    function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
    addEventListener("resize", resize); resize();

    let pieces = [];
    function popConfetti(n=120){
      pieces = [];
      for(let i=0;i<n;i++){
        pieces.push({
          x: Math.random()*canvas.width,
          y: -20 - Math.random()*canvas.height*0.2,
          r: 4 + Math.random()*5,
          vx: -2 + Math.random()*4,
          vy: 2 + Math.random()*5,
          a: Math.random()*Math.PI*2,
          va: -0.15 + Math.random()*0.3,
          life: 120 + Math.random()*80
        });
      }
      requestAnimationFrame(tick);
    }
    function tick(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      for(const p of pieces){
        p.x += p.vx; p.y += p.vy; p.a += p.va; p.life -= 1;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.a);
        ctx.fillStyle = ["#ff4d7d","#ff7aa2","#ffd1dc","#ffffff","#ffb3c7"][Math.floor(Math.random()*5)];
        ctx.fillRect(-p.r, -p.r, p.r*2, p.r*2);
        ctx.restore();
      }
      pieces = pieces.filter(p => p.life>0 && p.y < canvas.height+40);
      if(pieces.length) requestAnimationFrame(tick);
    }
  </script>
</body>
</html>
