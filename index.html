<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Valentine Invite</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #ffe6ec;
  font-family: system-ui;
  text-align: center;
  overflow: hidden; /* so hearts don't show outside */
}

/* Floating hearts background */
.hearts {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}

.heart {
  position: absolute;
  bottom: -60px;
  width: 22px;
  height: 22px;
  background: rgba(255, 77, 125, 0.28);
  transform: rotate(45deg);
  border-radius: 4px;
  animation: floatUp linear infinite;
  filter: blur(0.2px);
}

.heart::before,
.heart::after {
  content: "";
  position: absolute;
  width: 22px;
  height: 22px;
  background: rgba(255, 77, 125, 0.28);
  border-radius: 50%;
}

.heart::before {
  left: -11px;
  top: 0;
}
.heart::after {
  left: 0;
  top: -11px;
}

@keyframes floatUp {
  0%   { transform: translateY(0) rotate(45deg); opacity: 0; }
  10%  { opacity: 1; }
  100% { transform: translateY(-120vh) rotate(45deg); opacity: 0; }
}

.card {
  background: white;
  padding: 40px;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  width: 90%;
  max-width: 420px;
  position: relative;
  z-index: 2; /* above hearts */
}

.btnrow {
  display: flex;
  justify-content: center;
  gap: 20px;   /* more space between buttons */
  flex-wrap: wrap;
  transition: gap 0.8s ease;
}

button {
  border: none;
  border-radius: 30px;
  padding: 12px 20px;
  margin: 8px;
  font-size: 16px;
  cursor: pointer;
  transition: all 0.8s ease;
}

.yes {
  background: #ff4d7d;
  color: white;
}

.maybe {
  background: #eee;
}

canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 3; /* confetti above everything */
}

/* shake animation */
@keyframes shake {
  0% { transform: translateX(0) scale(var(--scale)); }
  25% { transform: translateX(-4px) scale(var(--scale)); }
  50% { transform: translateX(4px) scale(var(--scale)); }
  75% { transform: translateX(-3px) scale(var(--scale)); }
  100% { transform: translateX(0) scale(var(--scale)); }
}

.shake {
  animation: shake 0.3s ease;
}
</style>
</head>

<body>

<!-- Heart background layer -->
<div class="hearts" aria-hidden="true">
  <!-- 14 hearts with different positions/speeds/sizes -->
  <div class="heart" style="left: 6%;  animation-duration: 12s; animation-delay: 0s;  transform: rotate(45deg) scale(0.9);"></div>
  <div class="heart" style="left: 14%; animation-duration: 16s; animation-delay: 2s;  transform: rotate(45deg) scale(1.2);"></div>
  <div class="heart" style="left: 22%; animation-duration: 14s; animation-delay: 5s;  transform: rotate(45deg) scale(0.8);"></div>
  <div class="heart" style="left: 30%; animation-duration: 18s; animation-delay: 1s;  transform: rotate(45deg) scale(1.0);"></div>
  <div class="heart" style="left: 38%; animation-duration: 13s; animation-delay: 3s;  transform: rotate(45deg) scale(1.4);"></div>
  <div class="heart" style="left: 46%; animation-duration: 17s; animation-delay: 6s;  transform: rotate(45deg) scale(0.9);"></div>
  <div class="heart" style="left: 54%; animation-duration: 15s; animation-delay: 4s;  transform: rotate(45deg) scale(1.1);"></div>
  <div class="heart" style="left: 62%; animation-duration: 19s; animation-delay: 0.5s;transform: rotate(45deg) scale(0.7);"></div>
  <div class="heart" style="left: 70%; animation-duration: 12.5s;animation-delay: 2.5s;transform: rotate(45deg) scale(1.3);"></div>
  <div class="heart" style="left: 78%; animation-duration: 16.5s;animation-delay: 5.5s;transform: rotate(45deg) scale(0.85);"></div>
  <div class="heart" style="left: 86%; animation-duration: 14.5s;animation-delay: 1.5s;transform: rotate(45deg) scale(1.15);"></div>
  <div class="heart" style="left: 92%; animation-duration: 20s; animation-delay: 3.5s;transform: rotate(45deg) scale(0.75);"></div>

  <div class="heart" style="left: 10%; animation-duration: 21s; animation-delay: 7s;  transform: rotate(45deg) scale(1.6);"></div>
  <div class="heart" style="left: 66%; animation-duration: 22s; animation-delay: 8s;  transform: rotate(45deg) scale(1.8);"></div>
</div>

<canvas id="confetti"></canvas>

<div class="card" id="card">
  <h2>Will you be my Valentine? 💌</h2>
  <p>I made something small for you 😊</p>

  <div class="btnrow" id="btnrow">
    <button class="yes" id="yes1">Yes 😊</button>
    <button class="yes" id="yes2">Super DUPER Yes 🤯</button>
    <button class="maybe" id="runaway" style="--scale:1;">Let me think… 🤔</button>
  </div>
</div>

<script>
let runCount = 0;
const maxRuns = 5;
let locked = false;

const runaway = document.getElementById("runaway");
const yes1 = document.getElementById("yes1");
const yes2 = document.getElementById("yes2");
const btnrow = document.getElementById("btnrow");

let runawayScale = 1;

function moveButton() {
  if (locked) {
    triggerShake();
    return;
  }

  if (runCount < maxRuns) {
    runCount++;
    runaway.style.position = "fixed";
    runaway.style.left = Math.random() * 80 + "%";
    runaway.style.top = Math.random() * 80 + "%";

    if (runCount === maxRuns) {
      returnToCenterAndAnimate();
    }
  }
}

function returnToCenterAndAnimate() {
  runaway.style.position = "relative";
  runaway.style.left = "0";
  runaway.style.top = "0";

  locked = true;

  // Increase spacing so YES buttons never touch while growing
  btnrow.style.gap = "42px";


  let step = 0;
  const steps = 10;

  const anim = setInterval(() => {
    step++;

    // shrink runaway gradually
    runawayScale -= 0.045;
    runawayScale = Math.max(0.55, runawayScale);
    runaway.style.setProperty("--scale", runawayScale);
    runaway.style.transform = `scale(${runawayScale})`;
    runaway.style.opacity = "0.9";

    // grow YES buttons gradually (same rate)
    const yesScale = 1 + step * 0.04;
    yes1.style.transform = `scale(${yesScale})`;
    yes2.style.transform = `scale(${yesScale})`;

    if (step >= steps) clearInterval(anim);
  }, 90);
}

function triggerShake() {
  runaway.classList.remove("shake");
  void runaway.offsetWidth;
  runaway.classList.add("shake");
}

runaway.addEventListener("mouseover", moveButton);
runaway.addEventListener("touchstart", (e) => {
  e.preventDefault();
  moveButton();
}, {passive:false});

function accept() {
  document.getElementById("card").innerHTML =
    "<h2>Nice. You're officially my Valentine ❤️</h2><p>Dinner at 8pm on Saturday?</p>";
  popConfetti(150);
}

yes1.addEventListener("click", accept);
yes2.addEventListener("click", accept);

/* CONFETTI */
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

let pieces = [];

function popConfetti(n=120){
  pieces=[];
  for(let i=0;i<n;i++){
    pieces.push({
      x:Math.random()*canvas.width,
      y:-20,
      r:4+Math.random()*4,
      vx:-2+Math.random()*4,
      vy:2+Math.random()*4,
      life:120+Math.random()*60
    });
  }
  requestAnimationFrame(update);
}

function update(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  pieces.forEach(p=>{
    p.x+=p.vx;
    p.y+=p.vy;
    p.life--;
    ctx.fillStyle="#ff4d7d";
    ctx.fillRect(p.x,p.y,p.r,p.r);
  });
  pieces=pieces.filter(p=>p.life>0);
  if(pieces.length) requestAnimationFrame(update);
}
</script>

</body>
</html>
